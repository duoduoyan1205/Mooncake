name: apply-memory-pool-d2h-bypass

on:
  pull_request:
    branches: [mpu-patch-base]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'mooncakempu-clean' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mooncakempu-clean
          fetch-depth: 1
      - name: Patch D2H staging path
        shell: python
        run: |
          from pathlib import Path
          p = Path('mooncake-store/src/file_storage.cpp')
          s = p.read_text()
          start = '''        // D2H staging: replace device slices with host memory slices\n        // so that storage_backend (ConcatSlicesToString / BuildBucket /\n        // WriteBucket) always receives host pointers.\n        std::unordered_map<std::string, std::vector<Slice>> host_batch_object;\n        std::vector<PinnedBufferPool::Buffer> staging_bufs;\n        auto runtime_accelerator =\n            device::GetAcceleratorRegistry().RuntimeAccelerators();\n\n        for (auto& [obj_key, slices] : batch_object) {'''
          replacement = '''        // Memory Pool is a GPU-native backend: preserve device slices so the\n        // backend can submit GPU HBM -> MPU/SUE transfers directly. All\n        // existing disk backends keep the historical D2H staging path.\n        std::unordered_map<std::string, std::vector<Slice>> host_batch_object;\n        std::vector<PinnedBufferPool::Buffer> staging_bufs;\n        if (config_.storage_backend_type == StorageBackendType::kMemoryPool) {\n            host_batch_object = batch_object;\n        } else {\n            auto runtime_accelerator =\n                device::GetAcceleratorRegistry().RuntimeAccelerators();\n\n            for (auto& [obj_key, slices] : batch_object) {'''
          if s.count(start) != 1:
              raise SystemExit(f'expected one D2H block start, found {s.count(start)}')
          s = s.replace(start, replacement, 1)
          marker = '''        auto offload_start = std::chrono::steady_clock::now();'''
          if s.count(marker) != 1:
              raise SystemExit('offload_start marker not found')
          s = s.replace(marker, '''            }\n        }\n\n        auto offload_start = std::chrono::steady_clock::now();''', 1)
          p.write_text(s)
          Path('.github/workflows/apply-memory-pool-d2h-bypass.yml').unlink()
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mooncake-store/src/file_storage.cpp .github/workflows/apply-memory-pool-d2h-bypass.yml
          git diff --cached --check
          git commit -m "feat(store): bypass D2H staging for memory pool"
          git push origin mooncakempu-clean
